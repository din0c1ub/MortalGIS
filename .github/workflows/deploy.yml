name: Scrape, Bake & Deploy

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight UTC
  workflow_dispatch: # Allows you to manually trigger the sync with a single click in GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write access to commit the updated JSON file back to the repo
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Base Dependencies
        run: npm ci

      - name: Execute De-Identification Scraper Pipeline
        run: npm run seed && npm run scrape

      - name: Save Aggregated Data & Commit to Main Branch
        run: |
          git config --global user.email "records-bot@mortalgis.local"
          git config --global user.name "MortalGIS Bot"
          
          git add src/anonymized_database.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "pipeline: automated update of de-identified records [skip ci]"
            git push origin main
          else
            echo "No new reports harvested. Skipping self-repo update."
          fi

      - name: Compile Optimized Static Assets
        run: npm run build

      - name: Synchronize to Hugging Face Free Space
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}     # Your Hugging Face username
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }} # Your Hugging Face Space name
          HF_TOKEN: ${{ secrets.HF_TOKEN }}           # Write-access Hugging Face user access token
        run: |
          # Guard and validate secrets before executing git operations
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ CRITICAL ERROR: Secret 'HF_TOKEN' is empty or missing!"
            echo "Please go to your GitHub repository -> Settings -> Secrets and variables -> Actions -> 'New repository secret', add 'HF_TOKEN' with a Hugging Face 'Write' access token."
            exit 1
          fi

          if [ -z "$HF_USERNAME" ]; then
            echo "❌ CRITICAL ERROR: Secret 'HF_USERNAME' is empty or missing!"
            echo "Please add 'HF_USERNAME' (your Hugging Face account name) in your GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$HF_SPACE_NAME" ]; then
            echo "❌ CRITICAL ERROR: Secret 'HF_SPACE_NAME' is empty or missing!"
            echo "Please add 'HF_SPACE_NAME' (the exact name of your Space) in your GitHub Repository Secrets."
            exit 1
          fi

          echo "🚀 Validated secrets successfully! Attempting connection to Hugging Face spaces..."

          # Clone the Hugging Face space repository into a local subfolder with token
          git clone "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" hf_space
          
          # Force copy compiled assets and metadata files
          cp -rf dist/* hf_space/
          cp -f README.md hf_space/
          
          cd hf_space
          git config --global user.email "deploy-bot@huggingface.co"
          git config --global user.name "MortalGIS Deploy Bot"
          
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "deploy: automated static build of scraped mortality GIS"
            git push "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME" main
            echo "🚀 Space deployed successfully!"
          else
            echo "💤 Space is already up to date."
          fi
