# PROPOSED additions to pipeline/sources.yml. NOT applied. (2026-10-10: entries whose ledger rows the owner approved moved into pipeline/sources.yml with status live; what is left here is still held, a lead, blocked or rejected.) Nothing in the repo was changed during the sourcing-only session (2026-10-07/08).
# Same fields as sources.yml. Statuses here are proposals: "live" means "ready to wire into statefill.py once audited", not "already used".
# Every entry records the publisher's own stated suppression rule, or "none stated". Agreement figures come from staging/stage_check.py
# (county-years where CDC publishes 10+ and the state agrees within max(2, 10%)); fills are CDC-hidden cells (1-9) the state value would un-hide.
# Raw source files are under ~/Desktop/MORTALGIS/sources/<id>/ with a SOURCES.tsv (URL, SHA-256) unless noted.

sources:
