  # ------------------------------------------------------------ candidates and leads (not pulled)

  - id: va_vdh_post2013
    name: "Virginia VDH locality death data after 2013 (natural causes: Tableau dashboard or a data request)"
    publisher: Virginia Department of Health
    url: https://www.vdh.virginia.gov/data/chronic-disease-in-virginia/deaths/
    status: candidate
    value: 3
    effort: 4
    notes: "The City/County Health Profiles stop at 2013. For 2014-2020 the stats page lists only PDFs of total deaths by race and locality ('By Locale') and monthly totals by county of residence for 2015-2018. The Chronic Disease Deaths Tableau dashboard (read in Chrome 2026-10-10, no download button) covers Alzheimer's, asthma, cardiovascular disease, chronic kidney disease, COPD, diabetes, heart disease, hypertension and stroke through 2024; its visible table is 35 health districts with age-adjusted rates, locality counts only through the selectors, small-count rule not stated: not scrapeable at scale. About 4,900 natural-cause cells are hidden for 2014-2024 (stroke, Alzheimer's, diabetes, flu and pneumonia, CLRD, liver, kidney). Route: a VDH data request. Injury causes are in va_ocme_annual."

  - id: va_ocme_annual
    name: Virginia Office of the Chief Medical Examiner annual reports, locality tables 2014-2023
    publisher: Virginia Department of Health, Office of the Chief Medical Examiner
    url: https://www.vdh.virginia.gov/medical-examiner/annual-reports/
    status: staged
    value: 1
    effort: 3
    notes: "Downloaded and parsed 2026-10-10: ten annual-report PDFs (2014-2022 by pdftotext, 2023 from the Tables of Deaths by Locality workbook), residence-locality tables for homicide, suicide, overdose and gun-related deaths, 133 localities each, exact counts, every table adds up to its printed subtotal and total. Bundle va_ocme_annual_county_2014-2023.json is staged in the master. It FAILS the agreement gate for all four causes (firearm 87.1%, suicide 86.6%, homicide 81.6%, overdose 77.4%; gate 90%): the tables are OCME cases, so Virginians who died in another state are missing and OCME runs a few deaths under CDC's residence counts (96-99% of CDC's total over the checked cells). Verdict SKIP, nothing used. No terms stated (none_stated). The successor to the retired VDH overdose-by-FIPS file, 'VDH PUD Overdose Deaths by Year and Geography' on data.virginia.gov (Virginia residents including out-of-state deaths, ICD-10 underlying cause, death certificates, 2019 to 2026-07, quarterly), is the better lead for overdose; a scripted request got HTTP 403, so it needs a browser save (owner)."

