    url: https://www.cdc.gov/nchs/products/vsus/vsus_1890_1938.htm
    license: "none stated (US federal publication; terms status none_stated)"
    access: "two PDFs (VSUS_1937_1.pdf, VSUS_1938_1.pdf) downloaded 2026-10-15 with the owner's yes; sources/vsus_1937_1938/, SHA-256 in SOURCES.tsv; transcribed with tools/vsus_1937_1938/"
    kind: state-counts
    geography: state
    place: [died]
    causes: [the 20 Miller causes (Table 19 columns added together; smallpox and List 196-198 from Table 18)]
    years: 1937-1938
    grain: year
    hidden: "none: exact state counts as printed"
    cadence: one-off (historical)
    files: [data_manual/hist_state/hist_vsus_1937_1938_state.json, data_manual/hist_state/vsus_1937_1938_table19_cells.json, data_manual/hist_state/vsus_1937_1938_table18_lines.json]
    status: staged
    notes: "Extends Miller's 1900-1936 state series to 1938 (same 4th-revision causes; place of occurrence as in the printed volumes). OCR values were settled with the table's own sums: by sex, by population group, and the row sum. Every unsettled row, and every column whose states did not add up, was checked by eye. In both years each of the 52 White/Other columns used adds up across the 48 states and DC to the printed United States line. 1937 total deaths for the 48 states, 1,441,700, plus DC's 8,727 equals the printed US total of 1,450,427. DC is left out, as in Miller's panel. Owner approved 2026-10-15 ('Approve (Recommended)')."
  - id: miller_vsh_1900_1936
    name: "Vital Statistics Deaths - Historical 1900-1936, state by year, by cause and by age and sex (Grant Miller, NBER)"
    publisher: "Grant Miller (Stanford), digitized from the Census Bureau / Public Health Service mortality statistics volumes; hosted by the NBER Public Use Data Archive"
    url: https://www.nber.org/research/data/vital-statistics-deaths-historical-1900-1936
    license: "stated: the page encourages use and sharing ('please feel free to share it with whomever might be interested'); no license text or citation format; terms status stated_review"
    access: "csv (master_mortality_data_1900_1936_ucb.csv, 461,932 bytes, saved by the owner from his own browser 2026-10-10; data.nber.org refuses automated downloads)"
    kind: state-counts
    geography: state
    place: [lived]
    causes: [total deaths, 20 causes of the printed volumes (not ICD groups), ages by sex]
    years: 1900-1936
    grain: year
    hidden: "none known: exact state counts; death-registration states only (10 states in 1900, 48 from 1933)"
    cadence: one-off (historical)
    files: [staging/historical/hist_miller_vsh_1900_1936_state.json]
    status: candidate
    value: 3
    effort: 3
    notes: "1,109 state-years, 48 states. In 1,102 of 1,109 the age groups add exactly to total deaths; the seven exceptions are the publisher's listed volume anomalies (Ohio 1916, Kentucky 1919, California and Indiana 1920, Massachusetts 1935) plus California and Utah 1935. The causes are a selection from the printed volumes, not a partition, and do not map to ICD groups, so they cannot share a legend with CDC causes. State level only; needs a separate historical mode (no county, no populations). Staged, not read by the build; nothing pre-1959 is merged."

