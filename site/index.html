<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="US county death rates: overdose, suicide, homicide, firearm, heart disease, life expectancy. Data from CDC NCHS and County Health Rankings.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>MortalGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen atlas. Control rail on the left (stacks under the map on phones), county map fills the rest. */
:root{
  --bg:#eef0f1; --panel:#f8f9f9; --ink:#1a222b; --muted:#5d6873; --line:#d3d8dc;
  --accent:#7a1f2b; --focus:#1f5f7a; --nodata:#dfe2e4; --stroke:#ffffff; --hatch:rgba(26,34,43,.28);
  --r0:#f4ebe6; --r1:#ecd2c6; --r2:#e2b1a0; --r3:#d38a77; --r4:#bd5f52; --r5:#9c3a37; --r6:#6e1f25;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171c; --panel:#192027; --ink:#e6eaee; --muted:#97a3ae; --line:#2b353f;
  --accent:#e58a7c; --focus:#7cc3df; --nodata:#232b33; --stroke:#12171c; --hatch:rgba(230,234,238,.3);
  --r0:#2a2427; --r1:#46292c; --r2:#672f30; --r3:#8f3b35; --r4:#bb5443; --r5:#e07d5e; --r6:#f6b48c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#192027; --ink:#e6eaee; --muted:#97a3ae; --line:#2b353f;
  --accent:#e58a7c; --focus:#7cc3df; --nodata:#232b33; --stroke:#12171c; --hatch:rgba(230,234,238,.3);
  --r0:#2a2427; --r1:#46292c; --r2:#672f30; --r3:#8f3b35; --r4:#bb5443; --r5:#e07d5e; --r6:#f6b48c;
  color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(300px,360px) 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 22px/1 var(--f-display);letter-spacing:.01em}
.brand span{color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.search{margin-left:auto;position:relative}
.search input{width:min(260px,60vw);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

aside{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.lbl{font:500 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;display:block}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.desc{color:var(--muted);font-size:13px;margin-top:6px}
.period{display:flex;align-items:center;gap:10px}
.period input[type=range]{flex:1;accent-color:var(--accent)}
.pval{font:500 13px var(--f-data);min-width:5.5em;text-align:right}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer}
.iconbtn:hover{border-color:var(--muted)}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.views button[aria-pressed=true]{border-color:var(--ink);font-weight:600}

.legend svg{display:block;width:100%;height:auto;overflow:visible}
.legend text{font:400 10.5px var(--f-data);fill:var(--muted)}
.legkeys{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legkeys i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}

.county{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.cname{font:600 20px/1.15 var(--f-display);text-wrap:balance}
.csub{color:var(--muted);font-size:13px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font:500 30px/1 var(--f-data);letter-spacing:-.02em}
.big small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:var(--accent);color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font:400 13px var(--f-data);font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 10px var(--f-data);fill:var(--muted)}
.chart h4,.allm h4{margin:0 0 4px;font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.allm table{width:100%;border-collapse:collapse;font-size:12.5px}
.allm td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.allm td.v{font-family:var(--f-data);text-align:right;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.allm td.p{width:72px;padding-left:10px}
.pbar{height:6px;background:var(--nodata);border-radius:3px;position:relative}
.pbar i{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}
.allm tr{cursor:pointer} .allm tr:hover td{color:var(--accent)}
.src{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.src a{color:inherit}

main{position:relative;min-width:0;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none}
#map .c{stroke:var(--stroke);stroke-width:.25;vector-effect:non-scaling-stroke;cursor:pointer}
#map .c:hover{stroke:var(--ink);stroke-width:1}
#map .states{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
#map .sel{fill:none;stroke:var(--focus);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
#map .hatch{pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:240px}
.tip b{font-family:var(--f-data)}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-size:16px}
.status{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 56vh auto;height:auto}
  main{grid-row:2;min-height:56vh}
  aside{grid-row:3;border-right:0;border-top:1px solid var(--line);overflow:visible}
  header{padding:10px 16px} aside{padding:16px}
  .search{margin-left:0;width:100%} .search input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">Mortal<span>GIS</span></div>
    <div class="tag">US county death rates from CDC and County Health Rankings</div>
    <div class="search">
      <label for="q" class="lbl" hidden>Find a county</label>
      <input id="q" list="countylist" placeholder="Find a county, e.g. Genesee, MI" autocomplete="off">
      <datalist id="countylist"></datalist>
    </div>
  </header>

  <aside>
    <div>
      <label class="lbl" for="measure">Cause of death</label>
      <select id="measure"></select>
      <div class="desc" id="mdesc"></div>
    </div>
    <div id="periodWrap">
      <label class="lbl" for="period">Year</label>
      <div class="period">
        <button class="iconbtn" id="play" type="button" aria-label="Play through years">▶</button>
        <input type="range" id="period" min="0" max="0" step="1" value="0">
        <span class="pval" id="pval"></span>
      </div>
    </div>
    <div>
      <span class="lbl">View</span>
      <div class="views" id="views">
        <button type="button" data-view="us" aria-pressed="false">United States</button>
        <button type="button" data-view="state" aria-pressed="true">Michigan</button>
        <button type="button" data-view="county" aria-pressed="false">Selected county</button>
      </div>
    </div>
    <div class="legend">
      <span class="lbl" id="legTitle">Rate</span>
      <svg id="legend" viewBox="0 0 320 34" role="img" aria-label="Map legend"></svg>
      <div class="legkeys">
        <span><i style="background:var(--nodata)"></i>No data</span>
        <label id="modKey" style="cursor:pointer"><input type="checkbox" id="showMod" checked style="margin:0 5px 0 0;vertical-align:-2px;accent-color:var(--accent)"><i style="background:repeating-linear-gradient(45deg,var(--hatch) 0 1.5px,transparent 1.5px 4px)"></i>Mark modeled rates (1–9 deaths)</label>
        <span>Classes hold even across years</span>
      </div>
    </div>
    <section class="county" id="county" aria-live="polite"></section>
    <div class="src" id="src"></div>
  </aside>

  <main>
    <svg id="map" role="img" aria-label="Choropleth map of US counties"></svg>
    <div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>
    <div class="tip" id="tip" hidden></div>
    <div class="status" id="status"></div>
    <div class="loading" id="loading">Loading county data…</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(async function(){
const $ = s => document.querySelector(s);
const DEFAULT = {measure:"overdose", fips:"26049"};
const state = {measure:null, period:null, fips:DEFAULT.fips, view:"state", playing:null};
const cache = {};
const fmt = v => Math.abs(v)>=1000 ? d3.format(",.0f")(v) : d3.format(",.1f")(v);
const _u = 0, fmtI = d3.format(","), pct = d3.format(".0%");

let meta, topo;
try{
  [meta, topo] = await Promise.all([fetch("data/meta.json").then(r=>r.json()), fetch("data/counties-10m.json").then(r=>r.json())]);
}catch(e){ $("#loading").textContent = "Couldn't load the county data files. Reload the page to try again."; return; }
$("#loading").hidden = true;

const counties = meta.counties; // [fips,name,state]
const idx = new Map(counties.map((c,i)=>[c[0],i]));
const M = new Map(meta.measures.map(m=>[m.key,m]));
const stAbbr = {"01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT","10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL","18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD","25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE","32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND","39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD","47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV","55":"WI","56":"WY"};
const label = c => `${c[1]}, ${stAbbr[c[0].slice(0,2)]||c[2]}`;
const ramp = () => { const cs=getComputedStyle(document.documentElement); return d3.range(7).map(i=>cs.getPropertyValue(`--r${i}`).trim()); };

// ---------- controls
const sel = $("#measure"); const groups = d3.group(meta.measures, m=>m.group);
for (const [g, ms] of groups){ const og=document.createElement("optgroup"); og.label=g; ms.forEach(m=>og.append(new Option(m.label,m.key))); sel.append(og); }
$("#countylist").innerHTML = counties.map(c=>`<option value="${label(c)}"></option>`).join("");
const byLabel = new Map(counties.map(c=>[label(c).toLowerCase(), c[0]]));

// ---------- map
const svg = d3.select("#map"), g = svg.append("g");
const features = topojson.feature(topo, topo.objects.counties).features.filter(f=>idx.has(f.id));
const nation = topojson.feature(topo, topo.objects.nation);
const projection = d3.geoAlbersUsa();
const path = d3.geoPath(projection);
const defs = svg.append("defs");
defs.append("pattern").attr("id","hatch").attr("patternUnits","userSpaceOnUse").attr("width",4).attr("height",4).attr("patternTransform","rotate(45)")
  .append("rect").attr("width",.7).attr("height",4).attr("fill","var(--hatch)");
const cPaths = g.append("g").selectAll("path").data(features).join("path").attr("class","c")
  .on("pointermove", hover).on("pointerleave", ()=>{$("#tip").hidden=true}).on("click", (e,d)=>select(d.id,true));
const hatchG = g.append("g").attr("class","hatch");
g.append("path").attr("class","states").datum(topojson.mesh(topo, topo.objects.states, (a,b)=>a!==b));
g.append("path").attr("class","states").datum(nation);
const selPath = g.append("path").attr("class","sel");

let W=0,H=0;
function layout(){
  const r = $("#map").getBoundingClientRect(); W=r.width; H=r.height;
  projection.fitExtent([[10,10],[W-10,H-10]], nation);
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  cPaths.attr("d", path); g.selectAll(".states").attr("d", path);
  drawHatch(); drawSel();
}
const zoom = d3.zoom().scaleExtent([1,60]).on("zoom", e=>{ g.attr("transform", e.transform); });
svg.call(zoom);
$("#zin").onclick = ()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);
$("#zout").onclick = ()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);
function zoomTo(gj, pad=.12){
  const [[x0,y0],[x1,y1]] = path.bounds(gj);
  if(!isFinite(x0)) return;
  const k = Math.min(60, (1-pad*2)/Math.max((x1-x0)/W,(y1-y0)/H));
  const t = d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(650).call(zoom.transform, t);
}
function setView(v){
  state.view=v;
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===v));
  const st = state.fips.slice(0,2);
  $("#views [data-view=state]").textContent = counties[idx.get(state.fips)][2] || "State";
  if(v==="us") svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity);
  else if(v==="state") zoomTo({type:"FeatureCollection",features:features.filter(f=>f.id.slice(0,2)===st)});
  else zoomTo(features.find(f=>f.id===state.fips), .3);
}
document.querySelectorAll("#views button").forEach(b=>b.onclick=()=>setView(b.dataset.view));

// ---------- data
async function load(key){
  if(!cache[key]) cache[key] = await fetch(`data/m_${key}.json`).then(r=>r.json());
  return cache[key];
}
function breaks(key, d, m){
  if (d._breaks) return d._breaks;
  const all = Object.values(d.rate).flat().filter(v=>v!=null).sort(d3.ascending);
  const q = [1,2,3,4,5,6].map(i=>d3.quantileSorted(all, i/7));
  return d._breaks = {q, min:all[0], max:all[all.length-1]};
}
function periodLabel(m,p){ return (m.periodLabels&&m.periodLabels[p]) || p; }

async function setMeasure(key, keepPeriod){
  const m = M.get(key); state.measure = key; sel.value = key;
  const d = await load(key);
  if(!keepPeriod || !m.periods.includes(state.period)) state.period = m.defaultPeriod;
  $("#mdesc").textContent = m.description;
  const pr = $("#period"); pr.max = m.periods.length-1; pr.value = m.periods.indexOf(state.period);
  $("#periodWrap").hidden = m.periods.length < 2;
  $("#modKey").hidden = !d.modeled;
  $("#legTitle").textContent = m.unit;
  $("#src").innerHTML = `<b>Source:</b> <a href="${m.sourceUrl}" target="_blank" rel="noopener">${m.source}</a>${m.asOf?` · data as of ${m.asOf}`:""}. ${m.notes}<br><br>Counties are where the person lived, not where they died. Rates use the county's population; small counties swing a lot from year to year.<br>Built ${meta.generated.slice(0,10)}.`;
  render();
}
function render(){
  const m = M.get(state.measure), d = cache[state.measure], p = state.period;
  const vals = d.rate[p], b = breaks(state.measure, d, m), R = ramp();
  const cols = m.higherIsBetter ? R.slice().reverse() : R;
  const scale = d3.scaleThreshold().domain(b.q).range(cols);
  const nodata = getComputedStyle(document.documentElement).getPropertyValue("--nodata").trim();
  cPaths.attr("fill", f=>{ const v=vals[idx.get(f.id)]; return v==null? nodata : scale(v); });
  $("#pval").textContent = periodLabel(m,p);
  drawLegend(b, cols, m);
  drawHatch();
  const n = vals.filter(v=>v!=null).length;
  $("#status").textContent = `${fmtI(n)} of ${fmtI(vals.length)} counties have data · ${periodLabel(m,p)}`;
  renderCounty();
}
function drawLegend(b, cols, m){
  const L = d3.select("#legend"); L.selectAll("*").remove();
  const w=320/7;
  cols.forEach((c,i)=>L.append("rect").attr("x",i*w).attr("y",0).attr("width",w-1).attr("height",12).attr("fill",c));
  const f = v => m.unit.startsWith("years")&&v<200 ? v.toFixed(1) : (v>=100? d3.format(",.0f")(v): v.toFixed(1));
  b.q.forEach((v,i)=>L.append("text").attr("x",(i+1)*w-0.5).attr("y",26).attr("text-anchor","middle").text(f(v)));
  L.append("text").attr("x",0).attr("y",26).text("lower").attr("text-anchor","start").attr("dx",0).style("display","none");
}
function drawHatch(){
  const d = cache[state.measure]; hatchG.selectAll("*").remove();
  if(!d || !d.modeled || !$("#showMod").checked) return;
  const mod = d.modeled[state.period];
  hatchG.selectAll("path").data(features.filter(f=>mod[idx.get(f.id)])).join("path").attr("d",path).attr("fill","url(#hatch)");
}
function drawSel(){ const f=features.find(f=>f.id===state.fips); selPath.datum(f||null).attr("d", f?path:null); }

function valueText(m, d, i, p){
  const v = d.rate[p][i]; if(v==null) return "No data";
  return m.unit.startsWith("years")&&!m.unit.includes("per") ? `${fmt(v)} yrs` : fmt(v);
}
function countText(d,i,p){
  if(!d.count) return null; const c = d.count[p][i];
  if(c==null) return null; if(c===-1) return "1–9 (suppressed)"; if(typeof c==="string") return `${c} (range)`; return fmtI(c);
}
function hover(e, f){
  const i = idx.get(f.id), m = M.get(state.measure), d = cache[state.measure], p = state.period;
  const c = countText(d,i,p);
  const t = $("#tip"); t.hidden=false;
  t.innerHTML = `<div>${label(counties[i])}</div><b>${valueText(m,d,i,p)}</b> <span style="color:var(--muted)">${m.unit}</span>${c?`<div style="color:var(--muted)">Deaths: ${c}</div>`:""}${d.modeled&&d.modeled[p][i]?`<div style="color:var(--accent)">Modeled estimate</div>`:""}`;
  const r = $("main").getBoundingClientRect(); let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  if(x+250>r.width) x-=270; if(y+90>r.height) y-=100;
  t.style.left=x+"px"; t.style.top=y+"px";
}

// ---------- county panel
function rankOf(vals, i, higherIsBetter, filter){
  const v = vals[i]; if(v==null) return null;
  const pool = vals.map((x,j)=>[x,j]).filter(([x,j])=>x!=null && (!filter||filter(j)));
  const worse = pool.filter(([x])=> higherIsBetter ? x < v : x > v).length;
  return {rank: worse+1, of: pool.length};
}
async function renderCounty(){
  const i = idx.get(state.fips); const c = counties[i]; const m = M.get(state.measure), d = cache[state.measure], p = state.period;
  const vals = d.rate[p]; const st = c[0].slice(0,2);
  const rU = rankOf(vals,i,m.higherIsBetter), rS = rankOf(vals,i,m.higherIsBetter,j=>counties[j][0].slice(0,2)===st);
  const med = d3.median(vals.filter(v=>v!=null)), medS = d3.median(vals.filter((v,j)=>v!=null&&counties[j][0].slice(0,2)===st));
  const cnt = countText(d,i,p), pop = meta.population[i];
  const worst = m.higherIsBetter ? "lowest" : "highest";
  let h = `<div><div class="cname">${c[1]} County, ${c[2]}</div><div class="csub">${pop?`Population ${fmtI(pop)} · `:""}FIPS ${c[0]}</div></div>
  <div><span class="lbl">${m.label} · ${periodLabel(m,p)}</span><div class="big"><b>${valueText(m,d,i,p)}</b><small>${m.unit}</small></div></div>
  <div class="chips">${d.modeled&&d.modeled[p][i]?`<span class="chip warn">Modeled: fewer than 10 deaths</span>`:""}<span class="chip">${m.rateType}</span></div>
  <dl class="facts">
    ${cnt?`<dt>Deaths</dt><dd>${cnt}</dd>`:""}
    ${rS?`<dt>Rank in ${c[2]}</dt><dd>${rS.rank} of ${rS.of} (1 = ${worst})</dd>`:""}
    ${rU?`<dt>Rank in US</dt><dd>${fmtI(rU.rank)} of ${fmtI(rU.of)}</dd>`:""}
    <dt>${c[2]} median</dt><dd>${medS!=null?fmt(medS):"—"}</dd>
    <dt>US county median</dt><dd>${med!=null?fmt(med):"—"}</dd>
  </dl>`;
  h += `<div class="chart" id="trend"></div><div class="chart" id="monthly"></div><div class="allm" id="allm"></div>`;
  $("#county").innerHTML = h;
  drawTrend(m,d,i,st);
  if (state.measure==="overdose") drawMonthly(i, st);
  drawAll(i);
}
function drawTrend(m,d,i,st){
  if(m.periods.length<2) return;
  const ps = m.periods.filter(p=>p!=="TTM");
  const pts = ps.map(p=>({p, v:d.rate[p][i], s:d3.median(d.rate[p].filter((v,j)=>v!=null&&counties[j][0].slice(0,2)===st))}));
  if(pts.every(x=>x.v==null)) return;
  const w=320,h=120,ml=34,mr=8,mt=8,mb=20;
  const x=d3.scalePoint(ps,[ml,w-mr]), y=d3.scaleLinear([0,d3.max(pts,q=>Math.max(q.v||0,q.s||0))*1.1||1],[h-mb,mt]).nice();
  const el=d3.select("#trend"); el.append("h4").text(`${m.label.split(" (")[0]} by year · county vs ${counties[i][2]} median`);
  const s=el.append("svg").attr("viewBox",`0 0 ${w} ${h}`);
  s.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("x1",ml).attr("x2",w-mr).attr("y1",y).attr("y2",y).attr("stroke","var(--line)");
  s.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x",ml-5).attr("y",v=>y(v)+3).attr("text-anchor","end").text(d3.format("~s"));
  const step = Math.ceil(ps.length/7);
  s.append("g").selectAll("text").data(ps.filter((p,k)=>k%step===0||k===ps.length-1)).join("text").attr("x",x).attr("y",h-5).attr("text-anchor","middle").text(p=>p.length===4?"’"+p.slice(2):p);
  const ln=d3.line().defined(q=>q.v!=null).x(q=>x(q.p)).y(q=>y(q.v));
  s.append("path").attr("d",d3.line().defined(q=>q.s!=null).x(q=>x(q.p)).y(q=>y(q.s))(pts)).attr("fill","none").attr("stroke","var(--muted)").attr("stroke-dasharray","3 3");
  s.append("path").attr("d",d3.area().defined(q=>q.v!=null).x(q=>x(q.p)).y0(h-mb).y1(q=>y(q.v))(pts)).attr("fill","var(--accent)").attr("opacity",.12);
  s.append("path").attr("d",ln(pts)).attr("fill","none").attr("stroke","var(--accent)").attr("stroke-width",2);
  s.append("g").selectAll("circle").data(pts.filter(q=>q.v!=null)).join("circle").attr("cx",q=>x(q.p)).attr("cy",q=>y(q.v)).attr("r",q=>q.p===state.period?4:2.2).attr("fill","var(--accent)");
}
async function drawMonthly(i, st){
  const key="mo"+st;
  try{ if(!cache[key]) cache[key]=await fetch(`data/monthly/${st}.json`).then(r=>r.json()); }catch(e){ return; }
  const md=cache[key], ser=md.series[counties[i][0]]; if(!ser || state.fips!==counties[i][0]) return;
  const pts=md.months.map((mo,k)=>({t:d3.timeParse("%Y-%m")(mo), v:ser[k]}));
  if(pts.every(q=>q.v==null)) return;
  const w=320,h=110,ml=34,mr=8,mt=8,mb=20;
  const x=d3.scaleTime(d3.extent(pts,q=>q.t),[ml,w-mr]), y=d3.scaleLinear([0,d3.max(pts,q=>q.v)*1.1],[h-mb,mt]).nice();
  const el=d3.select("#monthly"); el.append("h4").text("Overdose deaths, rolling 12 months (provisional)");
  const s=el.append("svg").attr("viewBox",`0 0 ${w} ${h}`);
  s.append("g").selectAll("line").data(y.ticks(3)).join("line").attr("x1",ml).attr("x2",w-mr).attr("y1",y).attr("y2",y).attr("stroke","var(--line)");
  s.append("g").selectAll("text").data(y.ticks(3)).join("text").attr("x",ml-5).attr("y",v=>y(v)+3).attr("text-anchor","end").text(d3.format("~s"));
  s.append("g").selectAll("text").data(x.ticks(d3.timeYear.every(1))).join("text").attr("x",x).attr("y",h-5).attr("text-anchor","middle").text(d3.timeFormat("%Y"));
  s.append("path").attr("d",d3.line().defined(q=>q.v!=null).x(q=>x(q.t)).y(q=>y(q.v))(pts)).attr("fill","none").attr("stroke","var(--ink)").attr("stroke-width",1.6);
  const last=pts.filter(q=>q.v!=null).at(-1);
  s.append("circle").attr("cx",x(last.t)).attr("cy",y(last.v)).attr("r",3.5).attr("fill","var(--ink)");
  s.append("text").attr("x",x(last.t)).attr("y",mt-1).attr("text-anchor","end").style("fill","var(--ink)").text(`${last.v} · ${d3.timeFormat("%b %Y")(last.t)}`);
  const sup=pts.filter(q=>q.v==null).length;
  if(sup) el.append("div").attr("class","desc").text(`${sup} months suppressed (1–9 deaths).`);
}
async function drawAll(i){
  const rows=[];
  for(const m of meta.measures){
    if(m.key==="firearm_suicide"||m.key==="firearm_homicide") continue;
    const d=await load(m.key); const p=m.defaultPeriod; const vals=d.rate[p]; const v=vals[i];
    let pc=null; if(v!=null){ const pool=vals.filter(x=>x!=null); pc = pool.filter(x=>x<v).length/pool.length; }
    rows.push({m,v,pc,p});
  }
  if(state.fips!==counties[i][0]) return;
  const h = `<h4>Every measure · position among US counties</h4><table>${rows.map(r=>`<tr data-k="${r.m.key}"><td>${r.m.label}<div class="desc" style="margin:0">${periodLabel(r.m,r.p)}</div></td><td class="v">${r.v==null?"—":fmt(r.v)}</td><td class="p">${r.pc==null?"":`<div class="pbar" title="Higher than ${pct(r.pc)} of counties"><i style="left:calc(${(r.pc*100).toFixed(1)}% - 1px)"></i></div>`}</td></tr>`).join("")}</table><div class="desc">Tick = where this county sits from lowest (left) to highest (right) value.</div>`;
  $("#allm").innerHTML=h;
  $("#allm").querySelectorAll("tr").forEach(tr=>tr.onclick=()=>setMeasure(tr.dataset.k));
}

function select(fips, fromMap){
  if(!idx.has(fips)) return;
  state.fips = fips; drawSel();
  $("#views [data-view=state]").textContent = counties[idx.get(fips)][2];
  renderCounty();
  if(!fromMap) setView("county");
}

// ---------- events
sel.onchange = ()=>setMeasure(sel.value, true);
$("#showMod").onchange = ()=>drawHatch();
$("#period").oninput = e=>{ state.period = M.get(state.measure).periods[+e.target.value]; render(); };
$("#play").onclick = ()=>{
  if(state.playing){ clearInterval(state.playing); state.playing=null; $("#play").textContent="▶"; return; }
  const m=M.get(state.measure); let k=m.periods.indexOf(state.period); if(k>=m.periods.length-1) k=-1;
  $("#play").textContent="❚❚";
  state.playing=setInterval(()=>{ k++; if(k>=m.periods.length){ clearInterval(state.playing); state.playing=null; $("#play").textContent="▶"; return;} state.period=m.periods[k]; $("#period").value=k; render(); }, 900);
};
$("#q").addEventListener("change", e=>{ const f=byLabel.get(e.target.value.trim().toLowerCase()); if(f){ select(f); e.target.blur(); } });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
new ResizeObserver(()=>{ layout(); }).observe($("#map"));

layout();
await setMeasure(DEFAULT.measure);
drawSel();
setTimeout(()=>setView("state"), 50);
})();
</script>
