    causes: [homicide]
    years: 2011-
    grain: day
    cadence: weekly
    layer: cincinnati_homicides
    status: live
    notes: "Two files in a row: the old RMS file k59e-2pvf to 2024-06-02 and the new STARS-category file 7aqy-xrv9 from 2024-06-03 (the city changed record systems). Offenses counted: murder, aggravated murder (and its felony/premeditated variants) and voluntary manslaughter; involuntary manslaughter, reckless and negligent homicide are left out. The old file repeats each incident several times with coordinates jittered by a few metres (same instanceid), so it is counted once per instanceid. 2010 is a part-year (27,488 records against 49,017 in 2011) and is left out. 18% of the rows have no coordinates in the source and are not on the map. No weapon field in the new file, so no firearm split. Only date and coordinates are requested; no victim age or sex. Preview built 2026-10-10; approved by the owner in chat 2026-10-10 (live in the repo copy, not pushed)."

