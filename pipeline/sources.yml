# MortalGIS source registry: every source the site uses, plus candidates we might add.
# pipeline/coverage.py reads this file after each build and writes site/data/coverage.json and COVERAGE.md.
# The research-queue workflow turns candidate / due / broken entries into GitHub issues.
#
# Fields
#   id          short unique id (also the GitHub issue key: "[source] <id>")
#   name, publisher, url, license
#   access      api | download | wonder-manual (a person clicks I Agree; pulled with the Chrome script) | browser
#   kind        county-counts | state-counts | points | model | summary | population | geography
#   geography   county | state | point | zip | grid-1km | town
#   place       lived | died | location        (where the death is counted)
#   causes      cause keys from build_data.CAUSES, or "all"
#   years       "first-last" (as published; "-" = to present)
#   grain       year | month | day | multi-year
#   hidden      what the publisher holds back (e.g. "1-9 deaths per county")
#   cadence     weekly | monthly | quarterly | yearly | static | manual-yearly
#   src         keys this source writes into each measure's d.src (build_data.SOURCES)
#   layer       incident layer key (incidents.py), for points
#   files       data_manual files this entry owns (globs)
#   status      live | candidate | rejected | parked
#   gap         (candidates) the coverage gap it fills, in plain words
#   value       (candidates) 1-5: counties x years un-hidden or deaths located, x reliability
#   effort      (candidates) 1-5
#   due_after   override: days after the newest data before the source counts as due
#   notes

sources:
  # ------------------------------------------------------------ county death counts and rates
  - id: nber
    name: NCHS multiple-cause-of-death public-use files (via NBER)
    publisher: CDC NCHS / NBER
    url: https://www.nber.org/research/data/mortality-data-vital-statistics-nchs-multiple-cause-death-data
    license: public domain (US government)
    access: download
    kind: county-counts
    geography: county
    place: [lived, died]
    causes: [all, overdose, suicide, homicide, firearm, heart, stroke, traffic]
    years: 1968-2004
    grain: year
    hidden: "none in the files; MortalGIS hides 1-9 itself. 1989-2004 files name only counties of 100,000+"
    cadence: static
    src: [nber, nber_partial]
    files: [hist_state/*.json]  # also claims the two state-level historical sets (Miller 1900-1936, infant deaths 1920-1945) that pipeline/hist_state.py reads
    status: live
    notes: pipeline/history.py; rebuilt only when NCHS or NBER revise files. data.nber.org refuses automated downloads (seen 2026-10-10), so history.py reads files saved by hand into .cache/ (or MORTALGIS_NBER_DIR) and never fetches them; the committed site/data/hist files are the output.

  - id: nber_small
    name: NCHS public-use death certificate files, exact counts of 1-9 (via NBER)
    publisher: CDC NCHS / NBER
    url: https://www.nber.org/research/data/mortality-data-vital-statistics-nchs-multiple-cause-death-data
    license: "NCHS data use rules (statistical reporting and analysis only; no identification, no linking); no minimum cell size is stated; the CDC WONDER wording for the same data advises not publishing sub-national counts of 9 or fewer (terms status stated_review)"
    access: download (saved by hand; data.nber.org refuses automated downloads)
    kind: county-counts
    geography: county
    place: [lived, died]
    causes: [all, overdose, suicide, homicide, firearm, heart, stroke]
    years: "1968-2004 (shown only in years the map takes from these files, mostly 1968-88; years CDC WONDER supplies keep CDC suppression)"
    grain: year
    hidden: "none in the files; pipeline/history.py hides 1-9 and this entry shows them again"
    cadence: static
    files: [nber_exact_small_1968-2004.json]
    status: live
    notes: "Owner decision 2026-10-10 (chat): don't hide 1-9 where no source forbids it; asked about the CDC WONDER advisory, answered 'Build it and approve now'. 330,740 exact cells in the file (residence 1968-88 156,597; place of death 1968-88 159,305; place of death 1989-2004 7,555, counties of 100,000 or more only). The build (pipeline/build_data.py, ledger rows nber_small / nber_small / <measure> / residence|occurrence) fills a cell only when it is hidden (count -1) in a year whose series source is nber or nber_partial; a cell a state source has already filled is left alone. Filled cells are marked 2 in the site data's filled arrays (1 = a state's count) and carry no rate (under 20 deaths). Not pushed."

