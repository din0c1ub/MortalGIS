    grain: year
    hidden: 1-9 deaths per county
    cadence: manual-yearly
    src: [wonder]
    files: [wonder/wonder_prov_occurrence_*.json, wonder/wonder_prov_residence_*.json, wonder/wonder_prov_more_*.json]
    status: live
    notes: The only source of "where they died" after 2004 (2018 on). Re-pull each spring when the prior year becomes final, and once or twice in between for the provisional year.

