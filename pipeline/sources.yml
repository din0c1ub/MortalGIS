    notes: pipeline/statefill.py, same fill-and-check rules as mi_mdhhs plus a per-year check (years where under 80% of county-years agree are skipped - e.g. a changed table layout). Columns are matched by name and aligned from the right (2008-2021 tables have an unlabeled Total column). Not used - Alcohol Poisoning (narrower than alcohol-induced), Pneumonia (no flu). Homicide includes legal intervention; agreement 92%.

