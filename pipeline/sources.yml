    geography: county
    place: [lived]
    causes: [all, overdose, suicide, homicide, firearm, heart, stroke, cancer, alzheimers, diabetes, liver, clrd, flu_pneumonia, kidney, falls, alcohol]
    years: 1999-2020
    grain: year
    hidden: 1-9 deaths per county
    cadence: static
    src: [wonder]
    files: [wonder/wonder_ucd_1999-2020.json, wonder/wonder_ucd_more_*.json]
    status: live

  - id: wonder_prov
    name: CDC WONDER Provisional Mortality 2018+ (D176), by county
